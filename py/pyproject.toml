[project]
name = "pied-piper"
version = "0.1.0"
description = "Python code guardrails for agentic coding workflows"
requires-python = ">=3.12"
dependencies = [
    "ruff>=0.11",
    "ty>=0.0.1a0",
    "import-linter",
    "vulture",
    "bandit",
    "complexipy>=5.0",
    "semgrep>=1.0.0",
]

[project.scripts]
pied-piper = "piper_py.cli:main"
piper = "piper_py.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piper_py"]

[tool.uv]
# semgrep pins tomli~=2.0.1 but complexipy needs tomli>=2.2.1.
# On Python 3.11+ tomllib is in the stdlib so tomli is a dead dep.
# Override to let the resolver pick a compatible version.
override-dependencies = ["tomli>=2.2.1"]

[dependency-groups]
dev = ["pytest"]
