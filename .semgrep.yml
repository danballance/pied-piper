rules:
  - id: no-eval
    patterns:
      - pattern: eval(...)
    message: "eval() is forbidden — use a safer alternative"
    languages: [python]
    severity: ERROR
    paths:
      exclude:
        - tests/
        - test/
        - __tests__/
        - "*_test.py"
        - "test_*.py"
        - conftest.py
        - "*.test.ts"
        - "*.test.js"
        - "*.spec.ts"
        - "*.spec.js"

  - id: no-hardcoded-secrets
    patterns:
      - pattern-regex: '(password|secret|api_key|token)\s*=\s*[\"''][^\"'']+[\"'']'
    message: "Possible hardcoded secret — use environment variables"
    languages: [python, typescript, javascript]
    severity: WARNING
    paths:
      exclude:
        - tests/
        - test/
        - __tests__/
        - "*_test.py"
        - "test_*.py"
        - conftest.py
        - "*.test.ts"
        - "*.test.js"
        - "*.spec.ts"
        - "*.spec.js"
